[project]
name = "mountain-software"
version = "0.1.0"
description = "Research pipeline: does terrain plus weather history explain wind loading and scour on Canadian Rockies peaks better than an aspect-only rule?"
readme = "README.md"
authors = [{ name = "McKinley Tysdal" }]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "rasterio>=1.5.2",
    "requests>=2.32",
    "scipy>=1.18.1",
]

[project.scripts]
mountain = "mountain_software.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]
app = [
    "streamlit>=1.40",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "realdata: checks against the real GPX files in the git-ignored folder; skipped when the files are missing",
]
